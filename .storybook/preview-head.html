<!--
  Les polices des marques, chargées pour l'APERÇU.

  Un design system déclare la police, il ne la livre pas : un consommateur du
  registre charge la sienne. Mais sans ces liens, Storybook rendait tout en
  pile système et le token typographique ne se voyait nulle part — on ne
  pouvait donc pas juger ce qu'on avait déclaré.

  PP Radio Grotesk, la police de titre d'Aikoz, est sous licence commerciale :
  elle n'est pas chargée ici et retombe sur la pile sans-serif. C'est visible,
  et c'est plus honnête qu'un substitut qui ferait croire au bon rendu.

  Montserrat est chargée pour ADP : c'est le dernier repli de sa pile, et la
  seule des trois géométriques librement disponible sur le web. Sans elle, un
  poste sans Gotham ni Century Gothic retombait sur la sans-serif système et
  ne montrait plus rien du caractère de la marque.
-->
