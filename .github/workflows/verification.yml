name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24, comme en local. La CI tournait en 20 avec npm 10 : un
          # verrou écrit par npm 11 lui est illisible, et elle tombait dès
          # `npm ci` sur « Missing: vite@8.3.0 », un message qui envoie
          # chercher du côté des dépendances au lieu de la version de npm.
          # Node 20 est par ailleurs déprécié sur les runners.
          node-version: 24
          cache: npm
      - run: npm ci

      # Les tokens sont générés : si la sortie committée diverge des sources
      # DTCG, tout le reste est mesuré sur des valeurs périmées.
      - name: Tokens
        run: npm run build:tokens

      - name: Types
        run: npx tsc --noEmit

      # ── Étanchéité des marques ───────────────────────────────────────────
      #
      # Sous une marque, aucune couleur ne doit venir de la rampe d'une autre.
      # Le défaut se réintroduit tout seul : il suffit d'un rôle nouveau posé
      # sur une primitive Aikoz « en attendant ». C'est arrivé quatre fois —
      # `text.accent` sur aquamarine, `brand.on-accent` sur midnight-blue,
      # `nav.on-muted` et `surface.action-secondary` sur ultramarine — et rien
      # ne le signalait, parce que le rendu était joli sous Aikoz.
      #
      # Les statuts et la palette de données sont exclus : ils sont communs par
      # construction, une hausse doit se lire pareil d'une marque à l'autre.
      - name: Étanchéité des marques
        run: python3 scripts/audit-etancheite.py

      # ── Le garde-fou qui manquait ────────────────────────────────────────
      #
      # `public/r/*.json` EMBARQUE le source de chaque composant : c'est une
      # copie, et une copie diverge. Corriger un composant sans relancer
      # `registry:build` laisse le registry PUBLIÉ servir l'ancienne version.
      # C'est arrivé : trois correctifs de nom accessible étaient dans le
      # source et absents du registry, donc `npx shadcn add stepper` installait
      # encore la version défectueuse. Rien ne l'aurait signalé.
      # ── Les chiffres de la vitrine sont COMPTÉS ──────────────────────────
      #
      # L'introduction annonçait « 37 composants » quand il y en avait 51. Le
      # chiffre avait été juste une fois, puis quatorze composants sont
      # arrivés et personne n'est retourné éditer la phrase. C'est la première
      # ligne que lit quelqu'un qui découvre le système, et elle mentait d'un
      # tiers.
      #
      # `chiffres.ts` est généré ; ce contrôle vérifie que le fichier commité
      # correspond encore à ce qu'on compte aujourd'hui.
      - name: Registry à jour
        run: |
          npm run registry:build
          if ! git diff --quiet -- docs/storybook/chiffres.ts; then
            echo "::error::Les chiffres de l'introduction ne correspondent plus."
            git diff -- docs/storybook/chiffres.ts
            echo "Correctif : npm run build:chiffres puis commit."
            exit 1
          fi
          if ! git diff --quiet -- public/r; then
            echo "::error::Le registry publié ne correspond plus aux sources."
            echo "Fichiers en écart :"
            git diff --name-only -- public/r
            echo "Correctif : npm run registry:build puis commit."
            exit 1
          fi

      # ── Le registry décrit-il ce qu'il contient ? ────────────────────────
      #
      # L'étape précédente compare `public/r/` aux sources : elle ne voit rien
      # d'une entrée qui n'existe pas. Quatre composants — brand-glow,
      # brand-mark, geo-drilldown, toast — étaient rendus, testés, documentés,
      # et absents de `registry.json` : impossibles à installer, et
      # `geo-drilldown` renvoyait 404 sur le site publié.
      #
      # Le même contrôle suit les imports de chaque composant et vérifie que
      # l'entrée les fournit, en fichiers livrés ou en `registryDependencies`.
      # Deux manquaient : `kpi-card` sans `progress-bar`, `site-nav` sans
      # `brand-mark`. Dans les deux cas `shadcn add` réussissait et la
      # compilation cassait chez le consommateur — donc chez Louis, pas ici.
      - name: Registry complet et installable
        run: npm run audit:registry

      # ── L'échelle typographique gouverne-t-elle ? ────────────────────────
      #
      # `build/semantics.css` émettait quarante rôles `--role-typography-*` que
      # ZÉRO composant ne consommait : les composants écrivent `text-sm` et
      # `font-semibold`, c'est-à-dire les valeurs par défaut de Tailwind.
      # L'échelle était déclarée, documentée, et sans effet — changer
      # `typography.body-md` ne déplaçait pas un pixel. Pire : `font-semibold`
      # (600), la graisse la plus employée du système, n'existait dans aucune
      # couche de tokens.
      #
      # Le pont `build/tailwind-typo.mjs` règle la cause. Ce contrôle règle la
      # récidive : une taille ou une graisse écrite en dur rouvre le trou.
      - name: L'échelle typographique gouverne
        run: npm run audit:typo

      # ── Tout ce qui bouge doit pouvoir s'arrêter ─────────────────────────
      #
      # `prefers-reduced-motion` n'est pas une option de confort : pour qui
      # souffre de troubles vestibulaires, une animation non sollicitée
      # provoque vertiges et nausées.
      #
      # Le design system l'écoutait à MOITIÉ — trois composants sur six.
      # `Accordion`, `ProgressBar` et `Skeleton` coupaient bien leur
      # animation ; `Switch` faisait glisser sa pastille de vingt pixels sans
      # rien demander, et `KpiCard` rétrécissait la carte entière à l'appui.
      # Une règle appliquée à moitié ne protège personne : l'utilisateur qui a
      # coché la case voit certaines choses s'arrêter et pas d'autres, sans
      # aucun moyen de savoir lesquelles.
      - name: Tout ce qui bouge peut s'arrêter
        run: npm run audit:mouvement

      # ── Les conventions, figées ──────────────────────────────────────────
      #
      # Neuf conventions étaient respectées par 48 composants sur 48 — ou 47
      # sur 48 — et aucune n'était écrite ni vérifiée. C'est de la DETTE DE
      # RÈGLE : une convention que tout le monde suit sans qu'elle existe
      # nulle part tient tant que la même personne écrit tout le code. Elle
      # tombe au premier composant écrit par quelqu'un d'autre, et personne ne
      # saura dire si c'est lui qui a dérivé ou la règle qui n'en était pas
      # une.
      #
      # Louis a l'accès `write`. C'est exactement le moment.
      - name: Les conventions du design system
        run: npm run audit:conventions

      # ── Dire ce qui change à qui l'installe ──────────────────────────────
      #
      # `ChartFrame` a perdu sa prop `tableCollapsed` le 21/09/2026. Louis
      # consomme le registry PUBLIÉ : à son prochain `shadcn add`, son code
      # aurait cessé de compiler, sans qu'aucun signal ne passe entre les
      # deux. Le dépôt était à `1.0.0` depuis le premier commit, et n'avait
      # pas de journal.
      #
      # Le contrôle n'exige rien d'une PR qui ne touche qu'à la documentation
      # ou aux tests : seulement de celles qui changent ce que le consommateur
      # installe.
      - name: La version dit ce qui change
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref || 'main' }}" || true
          npm run audit:version

      # Les stories SONT les tests : axe y tourne en mode `error`, une
      # violation d'accessibilité fait échouer la marche.
      - name: Stories
        run: npx playwright install --with-deps chromium && npx vitest run --project=storybook
