# Publie le design system sur GitHub Pages.
#
# Deux choses y sont servies, et l'ordre d'importance a changé :
#
#   /                → le STORYBOOK. C'est la vitrine : composants, doc,
#                      tokens, décisions, archive. C'est ce qu'on partage.
#   /playground/     → l'ancien aperçu. Il reste tant que Louis y teste des
#                      composants ; il disparaîtra avec la transition.
#
# Pourquoi une action plutôt qu'un dossier commité : la sortie pèse une
# quinzaine de mégaoctets de binaires et se régénère à chaque build. La
# committer chargerait l'historique d'un bundle minifié qu'aucun agent ne sait
# lire et que GitHub n'affiche pas de lui-même.
name: Design system

on:
  push:
    branches: [main]
  # Permet de republier à la main sans attendre un commit.
  workflow_dispatch:

# Une seule publication à la fois ; une nouvelle annule celle en cours.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24, comme en local. La CI tournait en 20 avec npm 10 : un
          # verrou écrit par npm 11 lui est illisible, et elle tombait dès
          # `npm ci` sur « Missing: vite@8.3.0 », un message qui envoie
          # chercher du côté des dépendances au lieu de la version de npm.
          # Node 20 est par ailleurs déprécié sur les runners.
          node-version: 24
          cache: npm
      - run: npm ci

      # Les tokens sont générés : sans cette étape, le CSS servi serait celui
      # du dernier commit et non celui des sources DTCG.
      - name: Tokens
        run: npm run build:tokens

      # Le Storybook référence ses assets en relatif (`./`) : il n'a donc
      # besoin d'aucun `--base`, contrairement au playground ci-dessous.
      - name: Storybook
        run: npm run build-storybook

      # `--base` doit valoir le chemin exact où Pages sert le playground.
      # Sans lui, les fichiers sont cherchés à la racine du domaine et la page
      # reste blanche — le piège déjà rencontré en local, et que `curl` ne
      # détecte pas puisque le repli SPA de Vite répond 200.
      - name: Playground
        run: npx vite build --base=/${{ github.event.repository.name }}/playground/
        env:
          NODE_ENV: production

      - name: Assembler
        run: |
          mkdir -p site
          cp -R storybook-static/. site/
          mkdir -p site/playground
          cp -R docs/preview/. site/playground/
          # Garde-fou : une page vide se publie sans erreur. On vérifie donc
          # que les deux points d'entrée existent AVANT de publier, plutôt que
          # de le découvrir sur l'URL publique.
          test -s site/index.html || { echo "::error::Storybook absent"; exit 1; }
          test -s site/playground/index.html || { echo "::error::playground absent"; exit 1; }
          # Les 19 logos de marque sont servis en chemin RELATIF depuis le
          # Storybook ; s'ils manquaient, les pastilles sortiraient vides.
          test -d site/brands || { echo "::error::les logos de marque manquent"; exit 1; }
          echo "Publié : $(du -sh site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
